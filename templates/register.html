{% extends "base.html" %}
{% block title %}Pendaftaran Siswa Baru — PerpusKu{% endblock %}

{% block content %}
<div class="relative py-8 sm:py-12 flex items-center justify-center">
    <!-- Ambient Backdrop Glows -->
    <div class="absolute -top-12 -right-12 w-72 h-72 rounded-full bg-primary/15 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-12 -left-12 w-72 h-72 rounded-full bg-accent/20 blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl border border-slate-200/90 p-8 sm:p-10 relative z-10 animate-slide-up">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-primary to-blue-600 text-white flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg shadow-primary/25 animate-float">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="font-heading text-2xl sm:text-3xl font-extrabold text-navy tracking-tight">Registrasi Akun Siswa</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1.5">Lengkapi data untuk mulai meminjam buku & reservasi koleksi</p>
        </div>

        <!-- Form Registrasi -->
        <form method="POST" action="{{ url_for('register') }}" class="space-y-4 text-xs">
            <!-- NIS & Kelas (Grid) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block font-bold uppercase tracking-wider text-slate-600 mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-id-card text-primary text-xs"></i>
                        <span>NIS Siswa *</span>
                    </label>
                    <input type="text" name="nomor_induk" required placeholder="Contoh: NIS105"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-primary focus:ring-4 focus:ring-blue-100 outline-none text-xs font-semibold transition">
                </div>

                <div>
                    <label class="block font-bold uppercase tracking-wider text-slate-600 mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-school text-primary text-xs"></i>
                        <span>Kelas *</span>
                    </label>
                    <input type="text" name="kelas" required placeholder="Contoh: XII IPA 1"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-primary focus:ring-4 focus:ring-blue-100 outline-none text-xs font-semibold transition">
                </div>
            </div>

            <!-- Nama Lengkap -->
            <div>
                <label class="block font-bold uppercase tracking-wider text-slate-600 mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-user text-primary text-xs"></i>
                    <span>Nama Lengkap Siswa *</span>
                </label>
                <input type="text" name="nama" required placeholder="Contoh: Muhammad Fariz"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-primary focus:ring-4 focus:ring-blue-100 outline-none text-xs font-semibold transition">
            </div>

            <!-- Email Sekolah -->
            <div>
                <label class="block font-bold uppercase tracking-wider text-slate-600 mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-envelope text-primary text-xs"></i>
                    <span>Email Sekolah / Siswa *</span>
                </label>
                <input type="email" name="email" required placeholder="fariz@sekolah.sch.id"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-primary focus:ring-4 focus:ring-blue-100 outline-none text-xs font-semibold transition">
            </div>

            <!-- Kata Sandi -->
            <div>
                <label class="block font-bold uppercase tracking-wider text-slate-600 mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-primary text-xs"></i>
                    <span>Kata Sandi Baru *</span>
                </label>
                <div class="relative">
                    <input type="password" name="password" id="input-reg-password" required placeholder="Minimal 6 karakter"
                           class="w-full pl-4 pr-11 py-2.5 rounded-xl border border-slate-200 focus:border-primary focus:ring-4 focus:ring-blue-100 outline-none text-xs transition">
                    <button type="button" onclick="toggleRegPassword()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition">
                        <i class="fa-regular fa-eye" id="reg-eye-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full mt-3 py-3.5 rounded-xl bg-gradient-to-r from-primary to-blue-600 hover:from-primary-700 hover:to-blue-700 text-white font-heading font-bold text-xs shadow-md shadow-primary/30 transition flex items-center justify-center gap-2 group">
                <i class="fa-solid fa-user-check group-hover:scale-110 transition-transform"></i>
                <span>Daftar Sekarang & Aktifkan Akun</span>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="mt-6 text-center text-xs text-slate-500 border-t border-slate-100 pt-5">
            Sudah memiliki akun terdaftar?
            <a href="{{ url_for('login') }}" class="text-primary font-bold hover:underline ml-1">Masuk di sini</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function toggleRegPassword() {
        const pwd = document.getElementById('input-reg-password');
        const icon = document.getElementById('reg-eye-icon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            pwd.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>
{% endblock %}
